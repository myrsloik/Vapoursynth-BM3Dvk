name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-non-windows-wheel:
    strategy:
      matrix:
        include:
        - arch: linux_x86_64
          runs-on: ubuntu-latest
        - arch: linux_aarch64
          runs-on: ubuntu-24.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_BUILD: cp314-*
        CIBW_BUILD_FRONTEND: uv
        # Headers only: nothing links the Vulkan loader, the core hands the plugin every entry
        # point already resolved. Taken from Khronos rather than the distribution package
        # because VSVulkan4.h is written against Vulkan 1.4, whose vkMapMemory2 and
        # vkUnmapMemory2 the 1.3.x packages these images ship do not declare. Installed rather
        # than left in the checkout so find_package(VulkanHeaders) in lib/CMakeLists.txt finds
        # it, which is what avoids threading a path through hatchling.
        CIBW_BEFORE_ALL_LINUX: >
          if command -v dnf >/dev/null 2>&1; then
            dnf -y install cmake git
          else
            apk add --no-cache cmake git
          fi &&
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git --depth 1 &&
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr &&
          cmake --install Vulkan-Headers/build &&
          rm -rf Vulkan-Headers
        # A writable prefix rather than /usr/local, which on the macOS runners has no include
        # directory and cannot get one without sudo. CMAKE_PREFIX_PATH is how the project's
        # find_package(VulkanHeaders) is pointed at it; hatch_build.py copies the environment
        # through to cmake, and cmake reads that variable from it.
        CIBW_BEFORE_ALL_MACOS: >
          rm -rf Vulkan-Headers &&
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git --depth 1 &&
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/tmp/vulkan &&
          cmake --install Vulkan-Headers/build &&
          rm -rf Vulkan-Headers
        # The deployment target must match the 15.0 hatch_build.py builds and tags with, or
        # delocate compares the dylib against cibuildwheel's default target -- 10.15 on x86_64,
        # 11.0 on arm64 -- and rejects the wheel it was just handed.
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15.0 CMAKE_PREFIX_PATH=/tmp/vulkan
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
      with:
        output-dir: dist
        extras: uv

    - uses: actions/upload-artifact@v7
      with:
        name: bm3dvulkan-${{ matrix.arch }}
        path: dist

  build-windows-wheel:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: astral-sh/setup-uv@v8.0.0

    # CMAKE_PREFIX_PATH rather than the project's VULKAN_INCLUDE_DIRECTORY cache variable,
    # because hatch_build.py forwards only VAPOURSYNTH_INCLUDE_DIRECTORY to cmake; cmake reads
    # this one from the environment on its own.
    - name: Install Vulkan headers
      run: |
        $prefix = "$env:RUNNER_TEMP\vulkan".Replace('\', '/')
        git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP\Vulkan-Headers"
        cmake -S "$env:RUNNER_TEMP\Vulkan-Headers" -B "$env:RUNNER_TEMP\Vulkan-Headers\build" -DCMAKE_INSTALL_PREFIX="$prefix"
        cmake --install "$env:RUNNER_TEMP\Vulkan-Headers\build"
        echo "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV

    - name: Build
      run: uv build

    - uses: actions/upload-artifact@v7
      with:
        name: bm3dvulkan-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: bm3dvulkan-win_amd64
        path: dist/*.whl

  publish:
    permissions:
      id-token: write
    needs: [build-non-windows-wheel, build-windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/R') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
