name: Release

on:
  push:
    tags:
      - 'R*'
  workflow_dispatch:

jobs:
  # The plugin is portable now, so wheels are built for every platform the core's Vulkan
  # device runs on. Only Vulkan HEADERS are needed at build time -- nothing links against
  # the loader -- so no driver or SDK install is required on the runners.
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: windows
            arch: x86_64
            runner: windows-latest
          - os: macos
            arch: arm64
            runner: macos-26
          - os: macos
            arch: x86_64
            runner: macos-26-intel

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Vulkan headers (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Install Vulkan headers (Windows)
        if: ${{ matrix.os == 'windows' }}
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP/Vulkan-Headers"
          echo "VULKAN_INCLUDE_DIRECTORY=$env:RUNNER_TEMP/Vulkan-Headers/include" >> $env:GITHUB_ENV

      - name: Install Vulkan headers (macOS)
        if: ${{ matrix.os == 'macos' }}
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          echo "VULKAN_INCLUDE_DIRECTORY=$RUNNER_TEMP/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Build wheel
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.os == 'macos' && matrix.arch || '' }}
        run: |
          python -m pip install -U build
          python -m build --wheel

      - uses: actions/upload-artifact@v7
        with:
          name: bm3dvulkan-${{ matrix.os }}-${{ matrix.arch }}-wheel
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install -U build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: bm3dvulkan-sdist
          path: dist/*.tar.gz

  publish-pypi:
    needs: [build-wheels, build-sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/R') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: [build-wheels, build-sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/R') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
