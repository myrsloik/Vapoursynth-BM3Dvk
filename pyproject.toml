[build-system]
requires = ["meson-python", "VapourSynth>=80"]
build-backend = "mesonpy"

[project]
name = "vapoursynth-bm3dvulkan"
description = "BM3D denoising filter for VapourSynth, running on the core's Vulkan device"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["vapoursynth", "bm3d", "denoise", "vulkan", "gpu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth>=80"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/myrsloik/Vapoursynth-BM3Dvk"
Issues = "https://github.com/myrsloik/Vapoursynth-BM3Dvk/issues"

# The import libraries meson writes beside the module on Windows; nothing links a plugin.
[tool.meson-python.wheel]
exclude = ["*.lib", "*.dll.a"]
