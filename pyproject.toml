[build-system]
requires = [
  "cmake>=3.20",
  "hatchling>=1.26",
  "packaging>=24",
  "VapourSynth>=74",
]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-bm3dmetal"
version = "4.0.0"
description = "BM3D denoising filter for VapourSynth, implemented in Metal"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["vapoursynth", "bm3d", "denoise", "metal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth>=74"]

[project.urls]
Repository = "https://github.com/Sunflower-Dolls/Vapoursynth-BM3DMETAL"
Issues = "https://github.com/Sunflower-Dolls/Vapoursynth-BM3DMETAL/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/CMakeLists.txt",
  "/LICENSE",
  "/README.md",
  "/hatch_build.py",
  "/lib",
  "/packaging",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"vapoursynth/plugins/bm3dmetal/libbm3dmetal.dylib" = "vapoursynth/plugins/bm3dmetal/libbm3dmetal.dylib"
"vapoursynth/plugins/bm3dmetal/manifest.vs" = "vapoursynth/plugins/bm3dmetal/manifest.vs"
